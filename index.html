<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Art Deck</title><link rel="stylesheet" href="styles.css"></head><body><div id="auth-page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#1a1410,#2e2520)"><div style="text-align:center;max-width:400px"><h1 style="font-size:3em;color:#d4a574">🎨 Art Deck</h1><form id="auth-form" style="display:flex;flex-direction:column;gap:1em"><input type="email" id="auth-email" class="form-input" placeholder="Email" required><div style="display:flex;gap:0.5em"><input type="password" id="auth-password" class="form-input" style="flex:1" placeholder="Password" required><button type="button" id="toggle-password" style="background:#2e2520;border:1px solid #3a3020;color:#d4a574;padding:0.5em;border-radius:8px">👁</button></div><div id="auth-error" style="color:#FF6B6B;min-height:20px;font-size:0.9em"></div><button type="submit" class="btn btn-primary btn-full">🔐 Login</button><button type="button" id="toggle-auth" style="background:none;border:1px solid #4a3a2a;color:#a0a0a0;padding:0.7em;border-radius:8px">Register</button></form></div></div><div id="app" style="display:none;grid-template-columns:80px 1fr;height:100vh"><div class="sidebar"><button class="sidebar-btn active" data-tab="collection">📚</button><button class="sidebar-btn" data-tab="profile">👤</button><button class="sidebar-btn" data-tab="leaderboard">🏆</button><button class="sidebar-btn" data-tab="packs">📋</button><button class="sidebar-btn" id="admin-btn" data-tab="admin" style="display:none">⚙</button><button class="logout-btn" id="logout-btn" style="margin-top:auto">🚪</button></div><div class="main-content"><div class="header"><h1 class="header-title" id="page-title">📚 Collection</h1><div class="header-info"><div class="user-info"><span class="user-name" id="user-name">Guest</span><span class="user-rank" id="user-rank">📑 Common</span></div><div class="coins-display"><span>💎</span><span id="coins-display">100</span></div></div></div><div class="content-area"><div id="collection-tab" class="tab-content active"><div class="collection-header"><h2 class="collection-title">🎨 Collection</h2><div class="collection-rating"><span class="collection-rating-label">Max Rating:</span><span class="collection-rating-value" id="max-rating">0</span></div></div><select id="rarity-filter" class="form-select" style="margin-bottom:1.5em"><option value="">All</option><option value="common">📑 Common</option><option value="uncommon">🎯 Uncommon</option><option value="rare">🏆 Rare</option><option value="mythical">💎 Mythical</option><option value="legendary">⭐ Legendary</option><option value="ancient">🔥 Ancient</option><option value="exceedingly_rare">✨ Exceedingly Rare</option><option value="immortal">⚠ Immortal</option></select><h3 style="margin-top:2em;color:#d4a574">📑 Cards without deck</h3><div id="cards-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:16px"></div><h3 style="margin-top:2em;color:#d4a574">🎴 My Decks</h3><div id="decks-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px"></div></div><div id="profile-tab" class="tab-content"><div class="profile-header"><h2>👤 Profile</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:1em;margin:1em 0"><div><span style="color:#a0a0a0;font-size:0.9em">Name</span><p style="font-size:1.3em;font-weight:600;color:#fff" id="profile-username">-</p></div><div><span style="color:#a0a0a0;font-size:0.9em">Email</span><p style="font-size:1.3em;font-weight:600;color:#fff" id="profile-email">-</p></div></div><div style="margin-top:1.5em;padding:1em;background-color:#2e2520;border-radius:8px;border:1px solid #3a3020"><span style="color:#a0a0a0;font-size:0.9em">MAX RATING</span><p style="font-size:2em;font-weight:700;color:#d4a574" id="profile-rating">0</p></div></div><div id="rating-breakdown" style="margin-top:2em"></div></div><div id="leaderboard-tab" class="tab-content"><h2>🏆 Leaderboard</h2><table class="leaderboard-table"><thead><tr><th>#</th><th>Player</th><th style="text-align:right">Rating</th><th style="text-align:right">Cards</th></tr></thead><tbody id="leaderboard-tbody"></tbody></table></div><div id="packs-tab" class="tab-content"><h2>📋 Shop</h2><div id="packs-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px"></div></div><div id="admin-tab" class="tab-content"><h2>⚙ Admin</h2><div id="admin-content"></div></div></div></div></div><div id="card-modal" class="modal"><div class="modal-content"><div class="modal-header"><h2 class="modal-title" id="modal-card-title"></h2><button class="modal-close">✕</button></div><div id="modal-card-image" style="text-align:center;margin:1.5em 0"><img id="modal-image" style="max-width:100%;border-radius:8px;cursor:pointer" alt="Card"></div><div class="modal-params-table"><div class="modal-param-cell"><span class="modal-param-label">Artist</span><span class="modal-param-value" id="modal-artist">-</span></div><div class="modal-param-cell"><span class="modal-param-label">Year</span><span class="modal-param-value" id="modal-year">-</span></div><div class="modal-param-cell"><span class="modal-param-label">Rarity</span><span class="modal-param-value" id="modal-rarity">-</span></div><div class="modal-param-cell"><span class="modal-param-label">In Collections</span><span class="modal-param-value" id="modal-count">0</span></div></div><div id="card-actions" style="margin-top:1.5em;display:flex;flex-direction:column;gap:0.5em"></div></div></div><div id="modal-fullscreen-image" class="modal-fullscreen-image"><button class="modal-fullscreen-close">✕</button><img id="fullscreen-image" alt="Fullscreen"></div><div id="deck-modal" class="modal"><div class="modal-content"><div class="modal-header"><h2 class="modal-title">🎴 Create Deck</h2><button class="modal-close">✕</button></div><div class="form-group"><label class="form-label">Name</label><input type="text" id="deck-name" class="form-input" placeholder="Deck Name"></div><div class="form-group"><label class="form-label">Description</label><textarea id="deck-description" class="form-textarea" placeholder="Description (optional)"></textarea></div><button class="btn btn-primary btn-full" id="create-deck-btn">Create</button></div></div><div id="deck-detail-modal" class="modal"><div class="modal-content"><div class="modal-header"><h2 class="modal-title" id="detail-deck-name"></h2><button class="modal-close">✕</button></div><p id="detail-deck-description" style="color:#a0a0a0;margin:1em 0"></p><div id="detail-deck-stats" style="display:grid;grid-template-columns:1fr 1fr;gap:1em;margin:1.5em 0"></div><h3 style="margin:1em 0">Cards in Deck</h3><div id="detail-deck-cards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;max-height:400px;overflow-y:auto"></div><div style="display:flex;gap:0.5em;margin-top:1.5em"><button class="btn btn-secondary" id="edit-deck-btn">✏️ Edit</button><button class="btn btn-danger" id="delete-deck-btn">🗑️ Delete</button></div></div></div><div id="add-card-modal" class="modal"><div class="modal-content"><div class="modal-header"><h2 class="modal-title">➕ Add to Deck</h2><button class="modal-close">✕</button></div><div class="form-group"><label class="form-label">Select Deck</label><select id="deck-choice" class="form-select"></select></div><div class="form-group"><label class="form-label">Copies</label><input type="number" id="copy-count" class="form-input" value="1" min="1"></div><button class="btn btn-primary btn-full" id="confirm-add-card">Add</button></div></div><div class="toast-container" id="toast-container"></div><script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js"><\/script><script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js"><\/script><script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js"><\/script><script type="module" src="config.js"><\/script><script type="module" src="app.js"><\/script></body></html>
